# 초안: 백엔드를 Azure App Service(Linux, Python 3.12)에 올린다.
# 실수로 배포되지 않도록 Actions 화면에서 직접 실행할 때만 돈다 (workflow_dispatch).
# 필요한 값 (GitHub 저장소 Settings)
# - Secrets: AZURE_WEBAPP_PUBLISH_PROFILE  (App Service > 게시 프로필 다운로드 내용)
# - Variables: AZURE_WEBAPP_NAME            (App Service 이름)
# 앱 설정(JWT_SECRET, STORE=cosmos, COSMOS_*, AZURE_*, CORS_ORIGINS)은 Azure 포털에서 넣는다. 여기에 적지 않는다.
name: backend (App Service) - draft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Package (app, requirements, startup.sh)
        run: zip -r ../backend.zip app requirements.txt startup.sh -x '*/__pycache__/*'
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend.zip
