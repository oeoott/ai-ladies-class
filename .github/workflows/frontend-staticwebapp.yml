# 초안: 프론트엔드를 Azure Static Web Apps에 올린다.
# 실수로 배포되지 않도록 Actions 화면에서 직접 실행할 때만 돈다 (workflow_dispatch).
# 빌드에 ../backend/app/content(감정·동화 JSON)가 필요하므로 저장소 전체를 받아 여기서 빌드하고,
# Static Web Apps에는 빌드 결과(frontend/dist)만 올린다 (skip_app_build).
# 필요한 값 (GitHub 저장소 Settings)
# - Secrets: AZURE_STATIC_WEB_APPS_API_TOKEN  (Static Web Apps > 배포 토큰 관리)
# - Variables: VITE_API_URL                   (백엔드 주소, 예: https://<앱 이름>.azurewebsites.net. 비밀값 아님)
name: frontend (Static Web Apps) - draft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
